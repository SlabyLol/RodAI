<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RodAI - Your AI Assistant</title>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root { --primary: #00ff9d; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        .container { display: flex; height: 100vh; }
        
        .sidebar {
            width: 280px;
            background: rgba(20, 20, 40, 0.95);
            border-right: 1px solid rgba(0, 255, 157, 0.2);
            display: flex;
            flex-direction: column;
        }
        
        .logo {
            padding: 24px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -2px;
            color: var(--primary);
        }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
        }
        
        .user { align-self: flex-end; background: #00ff9d; color: black; }
        .ai { align-self: flex-start; background: rgba(255,255,255,0.1); }
        
        .input-area { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .input-box {
            display: flex;
            gap: 12px;
            background: rgba(30,30,50,0.8);
            border-radius: 9999px;
            padding: 8px;
        }
        
        input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 12px 20px;
        }
        
        button {
            background: var(--primary);
            color: black;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .status { font-size: 14px; padding: 5px 12px; border-radius: 999px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">RodAI</div>
        </div>

        <div class="chat-area">
            <div class="header">
                <h2>RodAI <span class="status" id="status">• Offline</span></h2>
                <button onclick="connectToPuter()" style="background:none;border:1px solid #00ff9d;color:#00ff9d;padding:8px 16px;border-radius:999px;cursor:pointer;">
                    <i class="fas fa-plug"></i> Connect Puter
                </button>
            </div>
            
            <div class="chat-container" id="chat">
                <div class="message ai">
                    Welcome to <strong>RodAI</strong>!<br><br>
                    Click "Connect Puter" to enable file upload, creation, and cloud storage.
                </div>
            </div>
            
            <div class="input-area">
                <div class="input-box">
                    <input type="text" id="userInput" placeholder="Ask RodAI anything..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div style="text-align:center; margin-top:12px;">
                    <button onclick="document.getElementById('fileInput').click()" style="background:none;border:none;color:#00ff9d;cursor:pointer;">
                        <i class="fas fa-upload"></i> Upload Files
                    </button>
                    <input type="file" id="fileInput" multiple style="display:none" onchange="uploadFiles(event)">
                </div>
            </div>
        </div>
    </div>

    <script>
        let isConnected = false;

        async function connectToPuter() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '• Connecting...';
            statusEl.style.color = '#ffaa00';

            try {
                // Better authentication method
                if (typeof puter.ui !== 'undefined' && puter.ui.authenticateWithPuter) {
                    await puter.ui.authenticateWithPuter();
                } else {
                    // Fallback
                    await puter.showUI();
                }
                
                isConnected = true;
                statusEl.textContent = '• Connected';
                statusEl.style.color = '#00ff9d';
                
                addMessage("✅ Successfully connected to Puter! You can now upload and manage files.", 'ai');
                
            } catch (err) {
                console.error(err);
                statusEl.textContent = '• Failed';
                statusEl.style.color = '#ff5555';
                addMessage("❌ Connection failed. Make sure you are on GitHub Pages (HTTPS) and not opening the file directly.", 'ai');
            }
        }

        function addMessage(text, type) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.innerHTML = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        async function uploadFiles(e) {
            if (!isConnected) {
                alert("Please connect to Puter first!");
                return;
            }
            
            const files = e.target.files;
            for (let file of files) {
                try {
                    await puter.fs.write(file.name, file);
                    addMessage(`✅ Uploaded: <b>${file.name}</b>`, 'ai');
                } catch (err) {
                    addMessage(`❌ Failed to upload ${file.name}`, 'ai');
                }
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, 'user');
            input.value = '';
            
            setTimeout(() => {
                addMessage("I'm RodAI. How can I help you with files or code today?", 'ai');
            }, 500);
        }

        // Auto-check on load
        window.onload = () => {
            if (typeof puter === 'undefined') {
                addMessage("Puter.js failed to load. Check your internet connection.", 'ai');
            }
        };
    </script>
</body>
</html>
